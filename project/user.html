<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>🎮 GameZone</h2>

    <div>
        <a href="tournaments.html">Tournaments</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<div class="dashboard">
    <h1>Welcome, <span id="username"></span> 👋</h1>

    <div class="cards">

        <div class="card">
            <h2>🏆 Tournaments</h2>
            <p>View available tournaments.</p>
            <a href="tournaments.html" class="btn">View</a>
        </div>

        <div class="card">
            <h2>🎮 My Games</h2>
            <p>Check your tournament registrations.</p>
        </div>

    </div>
</div>

<script src="script.js"></script>

<script>
    let user = JSON.parse(localStorage.getItem("loggedInUser"));

    if (user) {
        document.getElementById("username").innerText = user.name;
    }
</script>

</body>
</html>
